<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Typography</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{padding:24px;font-family:var(--font-sans), system-ui, sans-serif}
h1{font-family:var(--font-serif), Georgia, serif;font-size:var(--text-xl);margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-block:12px}
.sw{inline-size:120px;font-size:var(--text-xs);color:var(--ink-2)}
.sw i{display:block;block-size:48px;border-radius:var(--radius);border:1px solid var(--rule);margin-block-end:6px}
.pill{font-size:var(--text-xs);padding:2px 8px;border-radius:999px}
</style>
</head>
<body>
<h1>Typography</h1>
<p style="font-family:var(--font-serif);font-size:var(--text-2xl);font-weight:600;margin:0">Source Serif 4 — headlines</p>
<p style="font-family:var(--font-serif);font-size:var(--text-lg);font-weight:600">Pay transparency law takes effect, requiring salary ranges in job ads</p>
<p style="font-size:var(--text-base)">Geist — interface and body copy. One sans carries labels, data, and prose.</p>
<p class="num" style="font-size:var(--text-sm);color:var(--ink-3)">Tabular numerals: 1,284 · 7.9 avg · 43%</p>
<p style="font-size:var(--text-xs);color:var(--ink-3)">Scale: xs 12 · sm 14 · base 16 · lg 18 · xl 22 · 2xl 28</p>
</body></html>
