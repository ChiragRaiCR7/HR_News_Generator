[project]
name = "hr-news"
version = "2.0.0"
description = "HR News Intelligence API: SerpAPI news search, Gemini analysis, SQLite history"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1,<2.2",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "httpx>=0.28,<1",
    "google-genai>=2.34,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "mypy>=2.4",
]
# Browser end-to-end tests; the version must match the installed Chromium build.
e2e = ["playwright==1.63.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests launch the demo server with a fixed argv built from sys.executable.
"tests/**" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
